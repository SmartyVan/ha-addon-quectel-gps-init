name: GPS Init
description: Initializes Quectel Mini PCIe modems for GPS-only mode (disables cellular radio, enables GNSS)
version: "1.1.0"
slug: gps-init
url: https://github.com/SmartyVan/ha-addon-quectel-gps-init
arch:
  - aarch64
  - amd64
  - armv7
startup: system
boot: auto
full_access: true
privileged:
  - SYS_RAWIO
options:
  at_port: /dev/ttyUSB2
schema:
  at_port: device(subsystem=tty)
